name: Delete print files from R2

# Manual clean-up after a piece is removed from the gallery: its print file
# stays in the R2 bucket (publicly reachable) until someone deletes it. Run:
#   gh workflow run r2-delete-print.yml -f files='IMG_1234.png|Other piece.png'
# Only print/<name>.png objects can be deleted, and only for pieces that are
# no longer in data/build_manifest.json.

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Print file names (as in R2 print/), separated by | — e.g. IMG_1234.png|PNG image 2.png"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          ref: main

      - name: Delete print files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a0abcb5fd9fb28c5aa65fb8841f889ae
          FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set — cannot reach R2." >&2
            exit 1
          fi
          # Validate every name before deleting anything: a plain .png file
          # name, and not the print file of a piece still in the catalogue.
          python3 - <<'PY' > /tmp/keys.txt
          import json, os, re, sys
          from pathlib import Path
          manifest = json.loads(Path("data/build_manifest.json").read_text())
          live = {stem.lower() for stem in manifest}
          names = [n.strip() for n in os.environ["FILES"].split("|") if n.strip()]
          if not names:
              sys.exit("no file names given")
          for n in names:
              if not re.fullmatch(r"[A-Za-z0-9 ._()-]+\.png", n) or ".." in n:
                  sys.exit(f"refusing {n!r}: not a plain .png file name")
              if n[:-4].lower() in live:
                  sys.exit(f"refusing {n!r}: that piece is still in data/build_manifest.json")
              print(n)
          PY
          ( cd worker && npm ci )
          WRANGLER="$GITHUB_WORKSPACE/worker/node_modules/.bin/wrangler"
          while IFS= read -r name; do
            echo "Deleting print/$name from R2 bucket 'artimages'..."
            "$WRANGLER" r2 object delete "artimages/print/$name" --remote
          done < /tmp/keys.txt
          echo "Done."
