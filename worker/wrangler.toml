# Cloudflare Worker — arttra.art checkout (slice 1: Stripe payment skeleton).
#
# One-time setup, run from inside this worker/ directory:
#   npx wrangler login                        # authorise wrangler with your Cloudflare account
#   npx wrangler secret put STRIPE_SECRET_KEY # paste your Stripe TEST secret key (sk_test_...)
#   npx wrangler deploy                       # deploys; prints the https://...workers.dev URL
#
# Then put that workers.dev URL into ../data/config.json  ->  "apiBase".
# Re-deploy any time with:  npx wrangler deploy

name = "arttra-checkout"
main = "src/index.js"
compatibility_date = "2026-05-21"

[observability]
enabled = true

# Public, non-secret configuration. (The Stripe key is a SECRET — set it with
# `wrangler secret put`, never put it here.)
[vars]
ALLOWED_ORIGIN = "https://arttra.art"
ARTWORKS_URL   = "https://arttra.art/data/artworks.json"
SUCCESS_URL    = "https://arttra.art/success.html"
CANCEL_URL     = "https://arttra.art/?checkout=cancelled"
DEV            = "false"

# --- Slice 2 (webhook -> Printful) — NON-secret config -----------------------
# Secrets (STRIPE_WEBHOOK_SECRET, PRINTFUL_API_KEY, STRIPE_SECRET_KEY) are NOT
# here — they live in .dev.vars and upload via `wrangler secret bulk`.

# Flat shipping the BUYER pays at checkout, in USD. Set to roughly cover
# Printful's per-order shipping for the priciest shape (framed/canvas ~ $12-16
# domestic) so shipping is pass-through. "0" = free shipping (loses money live).
SHIPPING_FLAT_USD = "0"

# Printful catalog VARIANT ids, chosen per artwork SHAPE. The webhook computes
# each artwork's shape from its print dimensions and maps:
#   square  (≈1:1)  -> PRINTFUL_VARIANT_SQUARE
#   portrait(tall)  -> PRINTFUL_VARIANT_PORTRAIT
#   landscape(wide) -> PRINTFUL_VARIANT_LANDSCAPE
# TODO: set the numeric variant id for each shape (e.g. a square canvas, a
# portrait framed poster, a landscape framed poster). Found via the v2 catalog.
PRINTFUL_VARIANT_SQUARE    = ""
PRINTFUL_VARIANT_PORTRAIT  = ""
PRINTFUL_VARIANT_LANDSCAPE = ""

# Fallback variant for any shape left unset above. Optional once the three
# shapes are filled.
PRINTFUL_DEFAULT_VARIANT_ID = ""

# Public URL of a print-resolution file used until slice 3 adds per-artwork
# files. TODO: set to a publicly reachable image URL (e.g. an R2/arttra.art URL).
PRINTFUL_FALLBACK_PRINT_URL = ""

# "true" auto-confirms the Printful draft for fulfillment. Keep "false" until
# you've eyeballed a draft order in the Printful dashboard and verified the v2
# payload shape. Flip to "true" only when ready to fulfill automatically.
PRINTFUL_AUTO_CONFIRM = "false"

# Print placement + technique, applied to every shape. PRODUCT-SPECIFIC and
# assumes all three shape variants are the SAME product family (e.g. all canvas,
# or all framed posters) so one placement/technique fits all. If you mix
# families (square canvas + rectangular framed), these would need to be
# per-shape — revisit then. Check valid values in the v2 catalog per variant.
PRINTFUL_PLACEMENT = "default"
PRINTFUL_TECHNIQUE = "digital-printing"
